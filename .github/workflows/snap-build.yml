name: Snap Build

on:
  push:
    branches: [main]

jobs:
  build-snap:
    name: Build .snap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: snapcore/action-build@v1
        id: build

      - name: Upload snap artifact
        uses: actions/upload-artifact@v4
        with:
          name: docflow-snap
          path: ${{ steps.build.outputs.snap }}
